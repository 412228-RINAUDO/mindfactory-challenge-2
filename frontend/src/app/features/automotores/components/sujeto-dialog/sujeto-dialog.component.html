<p-dialog
  header="Registrar Nuevo Dueño"
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: '400px' }"
  [closable]="true"
  (onHide)="onCancel()"
>
  <form [formGroup]="form" class="flex flex-col gap-4 pt-4">
    <div class="flex flex-col gap-1">
      <p-floatlabel variant="on">
        <input
          pInputText
          id="dialogCuit"
          formControlName="cuit"
          [readonly]="true"
          class="w-full"
        />
        <label for="dialogCuit">CUIT</label>
      </p-floatlabel>
    </div>

    <div class="flex flex-col gap-1">
      <p-floatlabel variant="on">
        <input
          pInputText
          id="denominacion"
          formControlName="denominacion"
          [invalid]="isInvalid('denominacion')"
          class="w-full"
        />
        <label for="denominacion">Nombre del Dueño *</label>
      </p-floatlabel>
      @if (isInvalid("denominacion")) {
        <p-message severity="error" variant="simple" size="small">
          {{ getErrorMessage("denominacion") }}
        </p-message>
      }
    </div>
  </form>

  <ng-template pTemplate="footer">
    <p-button
      label="Cancelar"
      severity="secondary"
      [outlined]="true"
      (onClick)="onCancel()"
    />
    <p-button
      label="Crear"
      [loading]="loading()"
      [disabled]="form.invalid"
      (onClick)="onSubmit()"
    />
  </ng-template>
</p-dialog>
